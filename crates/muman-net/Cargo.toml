[package]
name = "muman-net"
description = "The network layer of muman: yt-dlp and aria2c fetches, and lookups on LRCLIB, MusicBrainz, AcoustID and the Cover Art Archive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# For tests alone, as muman-core's: the hooks and fakes the other
# crates' tests share, and a fake LRCLIB server.
testing = ["muman-core/testing", "muman-media/testing"]

[dependencies]
muman-core.workspace = true
muman-media.workspace = true
anyhow.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size.workspace = true
unicode-width.workspace = true

[dev-dependencies]
muman-core = { workspace = true, features = ["testing"] }
muman-media = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
