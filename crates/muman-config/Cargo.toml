[package]
name = "muman-config"
description = "The config layer of muman: the song list, its settings, editions and hooks, and the queries that pick its songs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# For tests alone, as muman-core's: the hooks and fakes the other
# crates' tests share.
testing = ["muman-core/testing", "muman-media/testing", "muman-net/testing"]

[dependencies]
muman-core.workspace = true
muman-media.workspace = true
muman-net.workspace = true
anyhow.workspace = true
directories.workspace = true
regex.workspace = true
serde.workspace = true
shell-words.workspace = true
strsim.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-normalization.workspace = true
which.workspace = true

[dev-dependencies]
muman-core = { workspace = true, features = ["testing"] }
muman-media = { workspace = true, features = ["testing"] }
muman-net = { workspace = true, features = ["testing"] }
tempfile.workspace = true
unicode-segmentation.workspace = true

[lints]
workspace = true
