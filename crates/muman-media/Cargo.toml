[package]
name = "muman-media"
description = "The media layer of muman: probing, decoding and measuring audio and pictures, tags, lyrics and names."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# For tests alone, as muman-core's: the hooks and fakes the other
# crates' tests share.
testing = ["muman-core/testing"]

[dependencies]
muman-core.workspace = true
anyhow.workspace = true
base64.workspace = true
chardetng.workspace = true
deunicode.workspace = true
ebur128.workspace = true
encoding_rs.workspace = true
html-escape.workspace = true
icu_casemap.workspace = true
icu_properties.workspace = true
icu_segmenter.workspace = true
lofty.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
unicode-security.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
muman-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
