# Proper nouns doc comments name; `..` keeps clippy's own list.
doc-valid-idents = ["YouTube", "FFmpeg", "SQLite", "LRCLIB", "MiniJinja", "MusicBrainz", "AcoustID", "WavPack", "APEv2", "ReplayGain", "WebVTT", "SubRip", ".."]

# A call that changes a file, allowed only where `#[expect]` says why, as
# tests/architecture.rs lists the files that may.
disallowed-methods = [
    { path = "std::fs::write", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::rename", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::copy", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::hard_link", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::remove_file", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::remove_dir", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::remove_dir_all", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::File::create", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::OpenOptions::new", reason = "changes a file: only where an `#[expect]` says why" },
]
