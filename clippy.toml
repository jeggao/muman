# Proper nouns doc comments name; `..` keeps clippy's own list.
doc-valid-idents = ["YouTube", "FFmpeg", "SQLite", "LRCLIB", "MiniJinja", "MusicBrainz", "AcoustID", "WavPack", "APEv2", "ReplayGain", "WebVTT", "SubRip", ".."]

# A call that changes a file, runs a program, reaches the terminal, makes
# a run's own file or follows a link, allowed only where `#[expect]` says
# why; tests/architecture.rs lists the files that may change files.
disallowed-methods = [
    { path = "std::fs::write", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::rename", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::copy", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::hard_link", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::remove_file", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::remove_dir", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::remove_dir_all", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::File::create", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::fs::OpenOptions::new", reason = "changes a file: only where an `#[expect]` says why" },
    { path = "std::process::Command::new", reason = "runs a program: only where an `#[expect]` says why" },
    { path = "std::io::stdin", reason = "reaches the terminal: only where an `#[expect]` says why" },
    { path = "std::io::stdout", reason = "reaches the terminal: only where an `#[expect]` says why" },
    { path = "std::io::stderr", reason = "reaches the terminal: only where an `#[expect]` says why" },
    { path = "muman_core::atomic::rename", reason = "moves a file safely: only where an `#[expect]` says why, as a library file moves only through the ledger" },
    { path = "muman_core::atomic::remove", reason = "removes a file safely: only where an `#[expect]` says why, as a library file goes only through the ledger" },
    { path = "muman_core::atomic::link", reason = "gives a file a second name: only where an `#[expect]` says why" },
    { path = "tempfile::Builder::new", reason = "makes a run's own file: in its scratch folder alone, where one a run stopped partway leaves is swept, and only where an `#[expect]` says why" },
    { path = "walkdir::WalkDir::follow_links", reason = "follows links: only where an `#[expect]` says why, as `given.rs` follows one inside a folder given to `add` only to a place inside it" },
]
