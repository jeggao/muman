[package]
name = "xtask"
version = "0.0.0"
description = "Repository checks for muman: comment rules and generated docs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap-markdown = "=0.1.5"
muman = { path = ".." }
regex = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
