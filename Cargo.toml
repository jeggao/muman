[package]
name = "muman"
version = "0.6.0"
description = "Keep a music library in step with a song list, each song made from the best of its sources."
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/jeggao/muman"
keywords = ["music", "library", "yt-dlp", "ffmpeg", "tagging"]
categories = ["command-line-utilities", "multimedia::audio"]
readme = "README.md"
exclude = [".github/", "xtask/"]

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
base64 = "0.23"
chardetng = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
ctrlc = { version = "3.5.2", features = ["termination"] }
deunicode = "1"
directories = "6"
dunce = "1"
ebur128 = "0.1.10"
encoding_rs = "0.8"
filetime = "0.2"
icu_casemap = "2.3"
icu_properties = "2.3"
icu_segmenter = "2.3"
indicatif = "0.18"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
lofty = "0.25"
minijinja = { version = "3", features = ["serde"] }
percent-encoding = "2"
regex = "1"
rusty-chromaprint = "0.3"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
shared_child = { version = "1.1.2", default-features = false }
shell-words = "1"
strsim = "0.11"
tempfile = "3"
terminal_size = "0.4"
toml = "1"
toml_edit = "0.25"
trash = "5"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
uom = { version = "0.38", default-features = false, features = ["f64", "si", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
walkdir = "2"
which = "8"
zip = { version = "9", default-features = false }

[lints]
workspace = true

[workspace]
members = [".", "xtask"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Audio code casts at every turn: sample and frame counts, seconds to
# samples, bytes to f64 for a ratio. Each cast was exempted where it
# stood, close to a hundred times and almost never with a reason, so the
# exemptions told a reader nothing. A cast's bounds are checked where
# they matter, as `units::whole` does, and these three lints are off.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# The loudness meter decodes whole songs; unoptimized, its tests take seconds each.
[profile.dev.package.ebur128]
opt-level = 3

[profile.release]
strip = "symbols"
