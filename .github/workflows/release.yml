name: Release

# A release is the merge of a `release:` pull request: the push to main
# that changes Cargo.toml's version tags it `v<version>`, and the tag's
# code is built into archives for each platform and published with its
# CHANGELOG.md section as the notes. A tag pushed by hand releases the
# same way, and `workflow_dispatch` builds a tag made before this
# workflow existed. The tag the workflow pushes starts no second run:
# GITHUB_TOKEN's pushes never do.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish, such as v0.4.1
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The same pin as ci.yml's, so a release is built with what CI tested.
  RUST_TOOLCHAIN: "1.99"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: decide
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          release=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null \
              || { echo "::error::no tag $tag"; exit 1; }
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            [ "$tag" = "v$version" ] \
              || { echo "::error::tag $tag is not Cargo.toml's v$version"; exit 1; }
          else
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag exists; nothing to release"
              release=false
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" -m "muman $version"
              git push origin "$tag"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-built on the Apple silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --package muman --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          name="muman-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/muman.exe" "$name"/
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/muman" "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            muman-*.tar.gz
            muman-*.zip
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Release notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v want="[$version]" '/^## \[/ { keep = ($2 == want); next } keep' CHANGELOG.md \
            | sed -e '1{/^$/d}' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: muman ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: archives/*
          generate_release_notes: false

  # Publishing to crates.io needs Trusted Publishing set up for this
  # repository and workflow on the crate's crates.io settings page, then
  # the repository variable PUBLISH_CRATE set to `true`. Until then the
  # crate is published by hand with `cargo publish`.
  crate:
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && vars.PUBLISH_CRATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked --package muman
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
