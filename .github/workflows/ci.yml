name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The toolchain every gating job runs; toolchain-preview.yml tries the
  # newest stable each week, and raising this is a pull request that
  # also fixes what its lints say.
  RUST_TOOLCHAIN: "1.99"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # setup-ffmpeg has x64 builds only; macOS runners are arm64. Its
      # download fails now and then, and once left main red for two days;
      # Linux then takes the distribution's own, above muman's floor.
      - if: runner.os != 'macOS'
        id: ffmpeg
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
      - if: runner.os != 'macOS' && steps.ffmpeg.outcome == 'failure'
        id: ffmpeg-again
        continue-on-error: ${{ runner.os == 'Linux' }}
        uses: FedericoCarboni/setup-ffmpeg@v3
      - if: runner.os == 'Linux' && steps.ffmpeg-again.outcome == 'failure'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install yt-dlp
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2
      - if: runner.os == 'macOS'
        run: brew install aria2
      - if: runner.os == 'Windows'
        run: choco install aria2 -y --no-progress
      - run: cargo test --test smoke --test ytdlp --test torrent --locked -- --ignored

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package muman --all-targets --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask comments --github-annotations
      - if: github.event_name == 'pull_request'
        run: cargo xtask comments --github-annotations --diff-base origin/${{ github.base_ref }}
      - if: github.event_name == 'push'
        run: cargo xtask commits --github-annotations
      - if: github.event_name == 'pull_request'
        run: cargo xtask commits --github-annotations --diff-base origin/${{ github.base_ref }}
      # The title and description are what a squash merge writes to main;
      # Dependabot's are its own and not checked.
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pull-request.txt"
          cargo xtask commits --github-annotations --message-file "$RUNNER_TEMP/pull-request.txt" --author "$AUTHOR"
      - run: cargo xtask docs --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
