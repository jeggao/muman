version = 1
edition = 2

# Settings, each written at its default; change any. A size, bitrate,
# time or share takes its unit: "2 GiB", "160 kb/s", "14 days", "1 %".
# `edition` names the settings' names and defaults the file was written
# to: a later muman renames what it renamed, and `muman sync
# --update-defaults` moves each setting still at a default it changed,
# leaving the ones you changed. A key a table does not know is an error.

[library]
# The library folder: absolute, ~/..., or relative to this file's folder.
# Unset, it is the platform's music folder, then `muman`; --library and
# MUMAN_LIBRARY override it on one machine.
# path = "~/Music/muman"
# Each song's path without its extension, as a MiniJinja template. See
# docs/configuration.md for the variables and filters.
template = "{{ album_artist }}/{{ album }}/{{ disc_track }}{{ title }}"
# What is replaced in tag values before they make a path; set "none" to
# replace only "/", or "ascii" to transliterate everything to ASCII.
restrict = "windows"
# Replacements merged over the defaults, such as { ":" = " -" }.
replace = {}
max_name_bytes = 200
max_folder_bytes = 120
# The longest whole path in characters, library folder included; unset,
# there is no limit. 250 keeps a library usable on Windows.
# max_path = 250
unknown_artist = "Unknown Artist"
unknown_album = "Unknown Album"
untitled = "Untitled"
# Where lyrics go: "sidecar" (.lrc beside the song), "embedded" or "both".
lyrics = "sidecar"
# Set the library folder's time after a change, for players that rescan
# only when it is newer.
touch_root = false
# The most the library may take, such as "32 GiB"; songs are encoded at
# lower bitrates of `[audio] lossy` to fit, the least audible first.
# Unset, there is no limit.
# max_size = "32 GiB"
# Each file counts rounded up to this: "32 KiB" on a FAT32 card.
block_size = "4 KiB"

[audio]
# Codecs a source's audio is copied in: opus, vorbis, aac, mp3, flac,
# alac and wavpack. Audio in any other is encoded: lossy audio to `lossy`,
# lossless audio to `lossless`, or FLAC or WavPack where that cannot keep
# it whole; audio already in that codec is copied.
codecs = ["opus", "flac"]
lossy = "opus"
lossless = "flac"
# Bitrates for audio that is encoded rather than copied. Vorbis and AAC
# are raised in proportion past two channels; MP3 holds two, and Opus at
# most 256 kb/s a channel.
opus_bitrate = "160 kb/s"
opus_surround_bitrate = "256 kb/s"
vorbis_bitrate = "192 kb/s"
aac_bitrate = "256 kb/s"
mp3_bitrate = "320 kb/s"
# The lowest bitrate a song is lowered to for `max_size`; unset, the
# encoder's lowest.
# min_bitrate = "64 kb/s"
# Speaker layouts audio is written in as it is, by ffmpeg's names, such
# as "stereo", "5.1" or "7.1.4": "5.1" takes "5.1(side)" too, and "any"
# takes every one. Audio in any other is mixed into the first of
# `downmix` with no more channels than it has, else the one with the
# fewest, scaled so it cannot clip.
layouts = ["any"]
downmix = ["stereo"]

[loudness]
# How each song is levelled to `target`, measured as EBU R128 measures:
# "tags" writes ReplayGain 2.0 gains and peaks that players apply, as
# R128 gains in Opus; "header" also writes the gain into each Opus file's
# header, which every Opus player applies; "audio" scales the samples,
# encoding audio that would be copied; "off" measures nothing and keeps
# the gains a source's tags carry.
mode = "tags"
target = "-18 LUFS"
# Peaks between samples, as a DAC rebuilds them, rather than the
# samples' own.
true_peak = true
# The gain "header" and "audio" apply: "album", its album's for a song on
# one, else its own; or "track", always its own.
scope = "album"
# A raising gain "header" or "audio" applies is lowered so the peak stays
# at or under this; a lowering one never is.
ceiling = "-1 dB"

# How the best of a song's sources is picked. Each measure scores a
# source in whole steps; the steps times the weight are summed, and the
# lowest sum wins. `enabled = false` or `weight = 0` ignores a measure.
# The weights below rank by each measure in turn, top first.
[quality.purity]
# Sound beyond the song, such as a video's intro, in steps of `step`.
enabled = true
weight = 10000
step = "2 s"
[quality.bandwidth]
# Where a lowpass cuts the audio off, a step per `step` lower.
enabled = true
weight = 10
step = "500 Hz"
[quality.stereo]
# One step for mono: the channels' energy no gain or lag between them
# explains is at most `incoherence`.
enabled = true
weight = 5
incoherence = "1 %"
[quality.clipping]
# A step for each share of clipped samples reached.
enabled = true
weight = 1
cutoffs = ["0.1 %", "1 %"]
[quality.square]
# One step for a cover that is not square within `tolerance`, the log
# of its sides' ratio.
enabled = true
weight = 10000
tolerance = 0.03
[quality.resolution]
# A cover's detail, a step per `step` less resolution.
enabled = true
weight = 20
step = "10 %"
[quality.blockiness]
# A cover's JPEG block artifacts, a step per `step`, ten at most.
enabled = true
weight = 1
step = 0.1

[ytdlp]
format = "bv*+ba/b"
sub_langs = "all,-live_chat"
concurrent_fragments = 4
# muman's postprocessors: no generated captions, square album art.
plugins = true
# More arguments, such as ["--cookies-from-browser", "firefox"].
args = []
# How long an unfinished download is kept to resume.
keep_partial = "14 days"

[history]
# Changing runs `undo` can put back, and the most their replaced files
# may take together.
runs = 3
max_size = "2 GiB"

# The sites yt-dlp fetches from. Each names its sources by its domain,
# whatever address they were found at: `extractors` are yt-dlp's
# extractors it names, each with the prefix its IDs take; each kind of
# source it holds has a prefix, a regular expression its IDs match and
# the address it is fetched again from, {id} its ID. A source of a site
# not listed is named by its page's domain and fetched again from it.
[sites."youtube.com"]
extractors = { youtube = "", youtubetab = "playlist/" }
kinds = [
    { prefix = "", id = "^[A-Za-z0-9_-]{11}$", fetch = "https://www.youtube.com/watch?v={id}" },
    { prefix = "playlist/", id = "^[A-Za-z0-9_-]+$", fetch = "https://www.youtube.com/playlist?list={id}" },
]
[sites."archive.org"]
extractors = { archiveorg = "" }
kinds = [{ prefix = "", fetch = "https://archive.org/details/{id}" }]
[sites."soundcloud.com"]
extractors = { soundcloud = "" }
[sites."bandcamp.com"]
extractors = { bandcamp = "" }
[sites."vimeo.com"]
extractors = { vimeo = "" }
[sites."dailymotion.com"]
extractors = { dailymotion = "" }
[sites."mixcloud.com"]
extractors = { mixcloud = "" }
[sites."audiomack.com"]
extractors = { audiomack = "" }
[sites."nicovideo.jp"]
extractors = { niconico = "" }
[sites."bilibili.com"]
extractors = { bilibili = "" }
[sites."x.com"]
extractors = { twitter = "" }
[sites."tiktok.com"]
extractors = { tiktok = "" }

[defaults]
# Subtitle languages lyrics are taken in, most preferred first.
lyrics = ["en"]
